[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "canismajor"
dynamic = ["version"]
description = "Engine de jogos 2D em Python, com shaders e elementos 3D, e editor no estilo da IDE Sirius."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PySide6-Essentials>=6.7",
    "moderngl>=5.10",
    "pygame-ce>=2.5",
    "numpy>=1.26",
    "Pillow>=10",
]

[project.scripts]
canismajor = "canismajor.__main__:main"

[project.gui-scripts]
canismajor-editor = "canismajor.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "canismajor.__version__" }

[tool.setuptools.packages.find]
include = ["canismajor*"]

[tool.setuptools.package-data]
canismajor = ["assets/*", "assets/fonts/*"]
